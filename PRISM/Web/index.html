function setting(ic,label,action){return `<button class="settingsrow" onclick="${action}">${icon(ic)}<span class="label">${label}</span><span>${icon('chevron')}</span></button>`}function renderMe(){document.querySelector('#app').innerHTML=`<div class="wrap"><div class="profilecover"><img src="${state.photo||'p0.svg'}" alt="Il tuo profilo"><div class="identity"><h1>${esc(state.name)}</h1><span>${esc(state.intent||'Nuove conoscenze')}</span></div></div><p style="line-height:1.6">${esc(state.bio||'Racconta qualcosa di te.')}</p><button class="primary wide" onclick="editMe()">Modifica il profilo</button><div class="stats"><button onclick="show('likes')"><b>${state.favorites.length}</b>Preferiti</button><button onclick="show('taps')"><b>${state.taps.length}</b>Tap inviati</button><button onclick="${activeStories().length?'ownStory(0)':'addStory()'}"><b>${activeStories().length}</b>Le mie storie</button></div><div class="panel">${setting('plus','Pubblica una storia','addStory()')}${setting('lock','Privacy e blocchi','privacyPage()')}${setting('settings','Informazioni sulla demo','aboutPage()')}${setting('exit','Esci','logout()')}</div></div>`}function editMe(){overlay(`<h1>Modifica profilo</h1><img class="hero" style="height:180px" src="${state.photo||'p0.svg'}" alt=""><label>Foto profilo<input type="file" accept="image/*" onchange="readPhoto(this,image=>{state.photo=image;save();document.querySelector('.overlay .hero').src=image})"></label><label>Nome<input id="myname" maxlength="30" value="${esc(state.name)}"></label><label>Bio<textarea id="bio" maxlength="400">${esc(state.bio)}</textarea></label><label>Cosa cerchi<select id="intent">${['Nuove conoscenze','Amicizia','Appuntamenti','Una relazione'].map(v=>`<option ${state.intent===v?'selected':''}>${v}</option>`).join('')}</select></label><button class="primary wide" onclick="saveMe()">Salva</button>`)}function saveMe(){let n=document.querySelector('#myname').value.trim();if(!n)return toast('Inserisci il nome');state.nam
